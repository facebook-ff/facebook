<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Google</title>
  <!-- Immediate meta refresh redirect -->
  <meta http-equiv="refresh" content="0; url=https://www.google.com">
  <!-- Optional: JavaScript fallback for browsers that ignore meta refresh -->
  <script>
    window.location.replace("https://www.google.com");
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="https://www.google.com">click here to go to Google</a>.</p>
</body>
</html>
